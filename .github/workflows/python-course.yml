name: Python course checks
on:
  push:
    paths:
      - "submissions/**"

permissions:
  contents: read

jobs:
  check:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      submission_id: ${{ steps.identify.outputs.submission_id }}
      task: ${{ steps.identify.outputs.task }}
      mode: ${{ steps.identify.outputs.mode }}
      total: ${{ steps.identify.outputs.total }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: identify
        name: Identify exercise and checks
        run: python3 -I -c "import sys; sys.path.insert(0, 'course'); from python_judge.github_ci import prepare; prepare()"
      - name: Prepare Python runtime
        run: docker pull python:3.12-slim-bookworm
      - name: Check submission
        run: python3 -I -c "import sys; sys.path.insert(0, 'course'); from python_judge.github_ci import main; main()"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/python-result.json
          if-no-files-found: error
          retention-days: 1
  publish-result:
    needs: check
    if: always() && needs.check.outputs.submission_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: course/python_judge/github_report.py
          sparse-checkout-cone-mode: false
      - if: needs.check.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: python-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/grade
      - name: Publish verdict
        env:
          GH_TOKEN: ${{ github.token }}
          SUBMISSION_ID: ${{ needs.check.outputs.submission_id }}
          TASK: ${{ needs.check.outputs.task }}
          MODE: ${{ needs.check.outputs.mode }}
          EXPECTED_TOTAL: ${{ needs.check.outputs.total }}
          CHECK_OUTCOME: ${{ needs.check.result }}
        run: python3 -I course/python_judge/github_report.py
